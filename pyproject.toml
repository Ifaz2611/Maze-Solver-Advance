[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maze-solver"
version = "1.0.0"
description = "Advanced Maze Solver Lab - weighted pathfinding, benchmarking, web GUI & procedural generation"
readme = "readme.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
optional-dependencies.dev = ["pytest", "Pillow"]

[project.scripts]
maze-solver = "maze_solver.__main__:main"

[project.urls]
Homepage = "https://github.com/Ifaz2611/Maze-Solver-Advance"

[tool.setuptools.packages.find]
where = ["src"]
